server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    # 后端容器可能被重建（IP 变化），用 Docker 内置 DNS 动态解析上游，
    # 避免 nginx 启动时缓存旧 IP 导致 /api、/media 返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # 前端 SPA 路由 /media 与后端静态资源前缀 /media/ 冲突：
    # nginx 会把 /media 301 到 /media/ 且丢掉端口，导致素材库页打不开。
    # 用精确匹配把 /media 交还给 SPA（/media/xxx 仍走后端静态资源）。
    location = /media {
        try_files /index.html =404;
    }

    # 二级页 /media/<项目ID> 同样是 SPA 路由：只把「纯数字」的路径交给 SPA，
    # 其余 /media/xxx（后端静态素材文件）仍反代到 backend，直接刷新页面也不会 404。
    location ~ ^/media/[0-9]+/?$ {
        try_files /index.html =404;
    }

    # 前端 SPA 路由 /assets（资产管理页）与 Vite 构建产物目录 /usr/share/nginx/html/assets 同名：
    # location / 的 try_files 会先命中物理目录 $uri/ 导致 /assets 返回 404。
    # 用精确匹配把 /assets 交还给 SPA；/assets/xxx.js|css 仍作为静态文件正常返回。
    location = /assets {
        try_files /index.html =404;
    }

    location /media/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
    }

    # index.html 每次回源校验：前端重建后产物 hash 会变，浏览器若用缓存里的旧 index.html
    # 就还在加载旧 JS，界面上看不到任何改动（实测踩过：改了 UI，用户刷新仍是老样子）。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
